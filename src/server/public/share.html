<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>会话分享 - AIAssets</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: system-ui, -apple-system, sans-serif; background: #09090b; color: #e4e4e7; }
    .wrap { max-width: 720px; margin: 0 auto; padding: 40px 20px; }
    .card { background: #18181b; border: 1px solid #27272a; border-radius: 12px; padding: 20px; margin-bottom: 12px; }
    .card.clickable { cursor: pointer; transition: border-color .15s, background .15s; }
    .card.clickable:hover { border-color: #3f3f46; background: #1c1c20; }
    .title { font-size: 14px; font-weight: 600; }
    .meta { font-size: 12px; color: #a1a1aa; margin-top: 6px; display: flex; gap: 12px; flex-wrap: wrap; }
    .badge { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 10px; border: 1px solid; }
    .codex { color: #7dd3fc; border-color: rgba(125,211,252,.3); background: rgba(125,211,252,.1); }
    .workbuddy { color: #d8b4fe; border-color: rgba(216,180,254,.3); background: rgba(216,180,254,.1); }
    .pi { color: #fdba74; border-color: rgba(253,186,116,.3); background: rgba(253,186,116,.1); }
    h1 { font-size: 18px; margin: 0 0 4px; }
    .page-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; }
    .import-mask { position: fixed; inset: 0; background: rgba(0,0,0,.75); backdrop-filter: blur(4px); display: none; align-items: center; justify-content: center; padding: 24px; z-index: 55; }
    .import-mask.open { display: flex; }
    .import-box { background: #18181b; border: 1px solid #27272a; border-radius: 12px; width: 100%; max-width: 460px; padding: 24px; }
    .import-box h3 { margin: 0 0 4px; font-size: 15px; }
    .import-box .hint { font-size: 12px; color: #a1a1aa; margin-bottom: 16px; }
    .sub { font-size: 12px; color: #a1a1aa; margin-bottom: 24px; }
    button { font: inherit; cursor: pointer; }
    .primary { background: #059669; border: none; color: #fff; padding: 10px 18px; border-radius: 8px; font-size: 13px; font-weight: 600; }
    .primary:disabled { background: #3f3f46; color: #71717a; cursor: not-allowed; }
    input { font: inherit; background: #09090b; border: 1px solid #3f3f46; color: #e4e4e7; padding: 8px 12px; border-radius: 8px; font-size: 13px; }
    label { font-size: 12px; color: #a1a1aa; display: block; margin-bottom: 4px; }
    .row { display: flex; gap: 12px; flex-wrap: wrap; align-items: flex-end; margin: 16px 0; }
    .row > div { flex: 1; min-width: 200px; }
    .toast { position: fixed; bottom: 24px; right: 24px; background: #18181b; border: 1px solid #27272a; padding: 12px 16px; border-radius: 8px; font-size: 13px; display: none; z-index: 60; }
    .preview-mask { position: fixed; inset: 0; background: rgba(0,0,0,.75); backdrop-filter: blur(4px); display: none; align-items: center; justify-content: center; padding: 24px; z-index: 50; }
    .preview-mask.open { display: flex; }
    .preview-box { background: #18181b; border: 1px solid #27272a; border-radius: 12px; width: 100%; max-width: 860px; max-height: 86vh; display: flex; flex-direction: column; }
    .preview-head { display: flex; align-items: center; justify-content: space-between; padding: 16px 20px; border-bottom: 1px solid #27272a; }
    .preview-body { overflow-y: auto; padding: 20px; }
    .bubble { margin-bottom: 14px; }
    .bubble .role { font-size: 11px; color: #a1a1aa; margin-bottom: 4px; font-weight: 600; }
    .bubble .content { background: #09090b; border: 1px solid #27272a; border-radius: 8px; padding: 12px 14px; font-size: 13px; line-height: 1.65; white-space: pre-wrap; word-break: break-word; max-height: 320px; overflow-y: auto; }
    .bubble.assistant .content { border-color: rgba(59,130,246,.25); }
    .bubble.tool .content { border-color: rgba(250,204,21,.2); font-family: ui-monospace, monospace; font-size: 12px; }
    .toolline { color: #facc15; font-size: 11px; margin-bottom: 4px; }
    .md-content h1 { font-size: 1.2rem; font-weight: 700; margin: .8rem 0 .5rem; }
    .md-content h2 { font-size: 1.05rem; font-weight: 600; margin: .7rem 0 .4rem; }
    .md-content h3 { font-size: .95rem; font-weight: 600; margin: .6rem 0 .3rem; }
    .md-content p { margin-bottom: .6rem; line-height: 1.6; }
    .md-content ul { list-style: disc; margin-left: 1.25rem; margin-bottom: .6rem; }
    .md-content ol { list-style: decimal; margin-left: 1.25rem; margin-bottom: .6rem; }
    .md-content code { background: #27272a; color: #60a5fa; padding: .1rem .3rem; border-radius: 4px; font-size: .85em; font-family: monospace; }
    .md-content pre { background: #09090b; border: 1px solid #27272a; border-radius: 6px; padding: .75rem; overflow-x: auto; margin: .6rem 0; }
    .md-content pre code { background: none; color: #e4e4e7; }
    pre { background: #09090b; border: 1px solid #27272a; border-radius: 8px; padding: 12px; font-size: 12px; max-height: 400px; overflow: auto; white-space: pre-wrap; display: none; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="page-head">
      <div>
        <h1>会话分享</h1>
        <p class="sub" id="shareMeta">加载中...</p>
      </div>
      <button class="primary" id="importOpenButton" style="display:none" onclick="openImportModal()">导入到我的 Hub</button>
    </div>
    <div id="codeGate" class="card" style="display:none">
      <label>此分享设置了访问码</label>
      <div style="display:flex;gap:8px">
        <input id="codeInput" type="text" placeholder="输入访问码">
        <button class="primary" onclick="loadSessions()">查看</button>
      </div>
    </div>
    <div id="list"></div>
    <div class="import-mask" id="importMask" onclick="if(event.target===this)closeImportModal()">
      <div class="import-box">
        <h3>导入到我的 Hub</h3>
        <p class="hint">填入你自己部署的 AIAssets 地址，会话将以副本形式导入到你的云端，之后可在你的 Hub 中同步到本地 Agent。</p>
        <div class="row" style="margin:0 0 16px">
          <div>
            <label>我的 Hub 地址</label>
            <input id="hubUrl" type="text" placeholder="https://my-hub.example.com" style="width:100%">
          </div>
          <div>
            <label>我的 Hub Token（远程访问需要）</label>
            <input id="hubToken" type="password" placeholder="可留空（本机访问）" style="width:100%">
          </div>
        </div>
        <div style="display:flex;justify-content:flex-end;gap:10px">
          <button style="background:#27272a;border:none;color:#a1a1aa;padding:10px 16px;border-radius:8px;font-size:13px" onclick="closeImportModal()">取消</button>
          <button class="primary" id="importButton" onclick="importAll()">确认导入</button>
        </div>
      </div>
    </div>  </div>
  <div class="toast" id="toast"></div>
  <div class="preview-mask" id="previewMask" onclick="if(event.target===this)closePreview()">
    <div class="preview-box">
      <div class="preview-head">
        <div style="font-size:14px;font-weight:600" id="previewTitle">会话预览</div>
        <button class="primary" style="padding:6px 12px;font-size:12px" onclick="closePreview()">关闭</button>
      </div>
      <div class="preview-body" id="previewBody"></div>
    </div>
  </div>
  <script src="/marked.umd.js"></script>
  <script>
    const shareId = location.pathname.split('/')[2] || '';
    const params = new URLSearchParams(location.search);
    let accessCode = params.get('code') || '';
    let allowImport = false;

    function toast(msg, ok = true) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.style.display = 'block';
      t.style.color = ok ? '#6ee7b7' : '#fda4af';
      setTimeout(() => { t.style.display = 'none'; }, 4000);
    }

    function withCode(u) {
      const sep = u.includes('?') ? '&' : '?';
      return accessCode ? u + sep + 'code=' + encodeURIComponent(accessCode) : u;
    }

    async function loadSessions() {
      accessCode = document.getElementById('codeInput').value || accessCode;
      const infoRes = await fetch(withCode('/api/shares/' + shareId));
      if (!infoRes.ok) {
        const err = await infoRes.json().catch(() => ({}));
        if (err.reason === 'access_code') {
          document.getElementById('codeGate').style.display = 'block';
          document.getElementById('shareMeta').innerText = '需要访问码';
          return;
        }
        document.getElementById('shareMeta').innerText = '分享不可用';
        return;
      }
      const info = await infoRes.json();
      allowImport = info.share.allowImport;
      const exp = new Date(info.share.expiresAt).toLocaleString('zh-CN', { hour12: false });
      document.getElementById('shareMeta').innerText = '共 ' + info.share.sessionCount + ' 个会话 · ' + (allowImport ? '可导入' : '仅查看') + ' · 有效期至 ' + exp;
      document.getElementById('codeGate').style.display = 'none';

      const res = await fetch(withCode('/api/shares/' + shareId + '/sessions'));
      const data = await res.json();
      if (!data.success) { toast('加载失败', false); return; }
      document.getElementById('list').innerHTML = data.items.map(s =>
        '<div class="card clickable" onclick="openPreview(\'' + s.id + '\')"><div class="title">' + (s.title || '（未命名会话）').replace(/</g, '&lt;') + '</div>' +
        '<div class="meta"><span class="badge ' + (s.sourceAgent || 'codex') + '">' + (s.sourceAgent === 'workbuddy' ? 'WorkBuddy' : s.sourceAgent === 'pi' ? 'Pi' : 'Codex') + '</span>' +
        '<span>' + (s.projectName || '未分组') + '</span><span>' + s.messageCount + ' 消息 · ' + s.toolCallCount + ' 工具</span>' +
        '<span>' + new Date(s.updatedAt).toLocaleDateString() + '</span></div></div>'
      ).join('') || '<div class="card">分享中的会话暂不可见</div>';

      document.getElementById('importOpenButton').style.display = data.allowImport && data.items.length ? 'inline-block' : 'none';
    }

    function esc(s) {
      return String(s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }

    function renderContent(text) {
      if (window.marked) {
        try { return marked.parse(String(text || '')); } catch {}
      }
      return esc(text);
    }

    async function openPreview(sessionId) {
      const mask = document.getElementById('previewMask');
      const body = document.getElementById('previewBody');
      document.getElementById('previewTitle').textContent = '加载中...';
      body.innerHTML = '<div style="text-align:center;color:#71717a;font-size:12px;padding:40px 0">加载中...</div>';
      mask.classList.add('open');
      try {
        const res = await fetch(withCode('/api/shares/' + shareId + '/preview?sessionId=' + encodeURIComponent(sessionId)));
        const data = await res.json();
        if (!data.success) throw new Error(data.error || '加载失败');
        const s = data.session;
        document.getElementById('previewTitle').textContent = s.title || '会话预览';
        const events = s.events || s.messages || [];
        if (!events.length) {
          body.innerHTML = '<div style="text-align:center;color:#71717a;font-size:12px;padding:40px 0">此会话暂无可预览内容</div>';
          return;
        }
        body.innerHTML = events.map(ev => {
          if (ev.kind === 'message') {
            const roleLabel = ev.role === 'user' ? '用户' : '助手';
            const cls = ev.role === 'user' ? 'user' : 'assistant';
            return '<div class="bubble ' + cls + '"><div class="role">' + roleLabel + '</div>' +
              '<div class="content' + (ev.role === 'assistant' ? ' md-content' : '') + '">' +
              (ev.role === 'assistant' ? renderContent(ev.content) : esc(ev.content)) + '</div></div>';
          }
          if (ev.kind === 'tool_call') {
            let cmd = '';
            try {
              const parsed = typeof ev.arguments === 'string' ? JSON.parse(ev.arguments) : ev.arguments;
              cmd = parsed.command || parsed.cmd || JSON.stringify(parsed || {});
            } catch { cmd = String(ev.arguments || ''); }
            const short = cmd.length > 300 ? cmd.slice(0, 300) + '...' : cmd;
            return '<div class="bubble tool"><div class="toolline">[工具] ' + esc(ev.name || 'Bash') + '</div>' +
              '<div class="content">' + esc(short) + '</div></div>';
          }
          if (ev.kind === 'tool_result') {
            const out = ev.output || '';
            const short = out.length > 500 ? out.slice(0, 500) + '...' : out;
            return '<div class="bubble tool"><div class="content">' + esc(short) + '</div></div>';
          }
          return '';
        }).join('');
      } catch (err) {
        body.innerHTML = '<div style="text-align:center;color:#fda4af;font-size:12px;padding:40px 0">' + esc(err.message || err) + '</div>';
      }
    }

    function closePreview() {
      document.getElementById('previewMask').classList.remove('open');
    }

    async function importAll() {
      const hubInput = document.getElementById('hubUrl');
      localStorage.setItem('my-hub-url', hubInput.value.trim());
      const hubUrl = document.getElementById('hubUrl').value.trim();
      const hubToken = document.getElementById('hubToken').value;
      if (!hubUrl) return toast('请填写你的 Hub 地址', false);
      const button = document.getElementById('importButton');
      button.disabled = true;
      button.textContent = '正在导入...';
      try {
        const res = await fetch('/api/shares/' + shareId + '/import', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ accessCode, hubUrl, hubToken })
        });
        const data = await res.json();
        if (data.success) {
          toast('成功导入 ' + data.imported + ' 个会话' + (data.failed.length ? '，失败 ' + data.failed.length + ' 个' : ''));
          closeImportModal();
        } else {
          toast(data.error || '导入失败', false);
        }
      } catch (err) {
        toast('导入失败: ' + err.message, false);
      } finally {
        button.disabled = false;
        button.textContent = '确认导入';
      }
    }

    function openImportModal() {
      document.getElementById('importMask').classList.add('open');
      const saved = localStorage.getItem('my-hub-url');
      if (saved) document.getElementById('hubUrl').value = saved;
    }

    function closeImportModal() {
      document.getElementById('importMask').classList.remove('open');
    }

    loadSessions();
  </script>
</body>
</html>
